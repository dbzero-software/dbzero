name: Test Windows Wheel

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 15
      pytest-markers:
        required: false
        type: string
        default: "-m 'not integration_test' -m 'not stress_test'"
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to test'
        required: true
        type: choice
        options:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        default: '3.12'
      timeout-minutes:
        description: 'Timeout in minutes'
        required: false
        type: number
        default: 15
      pytest-markers:
        description: 'Pytest markers (e.g., -m stress_test)'
        required: false
        type: string
        default: "-m 'not integration_test' -m 'not stress_test'"

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-${{ inputs.python-version }}
          path: ./wheels/
      
      - name: Install wheel and dependencies
        run: |
          uv sync --locked --no-install-project
          Get-ChildItem -Path "./wheels/*.whl" | ForEach-Object { uv pip install --python .venv/Scripts/python.exe $_.FullName }
        shell: powershell
      
      - name: Run tests
        run: |
          uv run --no-sync python -m pytest ${{ inputs.pytest-markers }} -c pytest.ini --capture=no -vv
