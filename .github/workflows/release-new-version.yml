name: Release New Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component for the new release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release-new-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare new version
        id: version
        run: |
          CURRENT=$(grep -m1 "^version = " pyproject.toml | sed "s/version = ['\"]\(.*\)['\"]/\1/")
          SETUP_CURRENT=$(grep -m1 "^    version=" dbzero/setup.py | sed "s/    version=['\"]\(.*\)['\"],/\1/")

          if [ "$CURRENT" != "$SETUP_CURRENT" ]; then
            echo "pyproject.toml version ($CURRENT) does not match dbzero/setup.py version ($SETUP_CURRENT)"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          sed -i "s/^version = '$CURRENT'/version = '$NEW'/" pyproject.toml
          sed -i "s/^    version='$CURRENT',/    version='$NEW',/" dbzero/setup.py

          grep -q "^version = '$NEW'" pyproject.toml
          grep -q "^    version='$NEW'," dbzero/setup.py

          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml dbzero/setup.py
          git commit -m "ci action: release version ${{ steps.version.outputs.version }}"
          git push origin HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
